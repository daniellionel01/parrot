# keep in sync with .github/workflows/ci.yaml
[tools]
gleam = "1.19.2"
erlang = "29"

[tasks.clean]
run = "gleam clean"

[tasks.update]
run = "gleam update"

[tasks.choire]
run = "gleam run -m choire"

[tasks.loc]
description = "count lines of code"
run = [
  "echo SOURCE && cloc . --vcs=git --exclude-dir=test",
  "echo TESTS && cloc test --vcs=git",
]

[tasks.db-up]
description = "start test databases (see compose.yaml)"
run = "if command -v podman >/dev/null; then podman compose up -d --wait; else docker compose up -d --wait; fi"

[tasks.db-down]
description = "stop test databases"
run = "if command -v podman >/dev/null; then podman compose down; else docker compose down; fi"

[tasks.test-integration]
description = "requires db-up, sqlite3, psql, pg_dump, mysql, mysqldump"
env = { PARROT_TEST_POSTGRES_URL = "postgresql://parrot:parrot@127.0.0.1:55432/parrot", PARROT_TEST_MYSQL_URL = "mysql://root:parrot@127.0.0.1:33306/parrot" }
run = "gleam test integration"

[tasks.test-postgres]
description = "round trip values through generated code, requires db-up"
dir = "test_projects/postgres"
env = { DATABASE_URL = "postgresql://parrot:parrot@127.0.0.1:55432/parrot_test_project" }
run = [
  "psql postgresql://parrot:parrot@127.0.0.1:55432/parrot -q -c 'drop database if exists parrot_test_project' -c 'create database parrot_test_project'",
  "psql $DATABASE_URL -q -v ON_ERROR_STOP=1 -f priv/schema.sql",
  "gleam run -m parrot",
  "gleam test",
]

[tasks.test-sqlite]
description = "round trip values through generated code"
dir = "test_projects/sqlite"
run = [
  "rm -f file.db",
  "sqlite3 file.db < priv/schema.sql",
  "gleam run -m parrot -- --sqlite file.db",
  "gleam test",
]

[tasks.test-mysql]
description = "round trip values through generated code, requires db-up"
dir = "test_projects/mysql"
env = { DATABASE_URL = "mysql://root:parrot@127.0.0.1:33306/parrot_test_project", MYSQL_PWD = "parrot" }
run = [
  "mysql --protocol=TCP -h 127.0.0.1 -P 33306 -u root -e 'drop database if exists parrot_test_project; create database parrot_test_project'",
  "mysql --protocol=TCP -h 127.0.0.1 -P 33306 -u root parrot_test_project < priv/schema.sql",
  "gleam run -m parrot",
  "gleam test",
]
