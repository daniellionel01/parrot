name: ci
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - "README.md"
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam test
      - run: gleam run -m birdie stale check

  test-integration:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: parrot
          POSTGRES_PASSWORD: parrot
          POSTGRES_DB: parrot
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0.30
        env:
          MYSQL_ROOT_PASSWORD: parrot
          MYSQL_DATABASE: parrot
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pparrot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - name: Install database clients
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y sqlite3 mysql-client postgresql-client-${{ matrix.postgres }}
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - run: pg_dump --version
      - run: gleam test integration
        env:
          PARROT_TEST_POSTGRES_URL: postgresql://parrot:parrot@127.0.0.1:55432/parrot
          PARROT_TEST_MYSQL_URL: mysql://root:parrot@127.0.0.1:33306/parrot
      # same as `mise run test-postgres`
      - name: test_projects/postgres
        working-directory: test_projects/postgres
        env:
          DATABASE_URL: postgresql://parrot:parrot@127.0.0.1:55432/parrot_test_project
        run: |
          psql postgresql://parrot:parrot@127.0.0.1:55432/parrot -q -c 'create database parrot_test_project'
          psql $DATABASE_URL -q -v ON_ERROR_STOP=1 -f priv/schema.sql
          gleam run -m parrot
          git diff --exit-code src/app/sql.gleam
          gleam test
